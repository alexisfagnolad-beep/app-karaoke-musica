name: karaoke_musica
description: "App de karaoke y práctica musical — Modo Karaoke Rápido (celular)."
# El proyecto no se publica en pub.dev.
publish_to: 'none'

# Versión de la app: <semver>+<build>
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Captura de micrófono: entrega un stream de muestras PCM (Float64) en vivo.
  flutter_audio_capture: ^1.1.9

  # Detección de pitch en tiempo real (algoritmo YIN), como pide el README.
  pitch_detector_dart: ^0.0.7

  # Permiso de micrófono en Android/iOS en tiempo de ejecución.
  permission_handler: ^11.3.1

  # Abrir un archivo de audio propio con el selector nativo del celular.
  # Se fija la línea 10.3.x: la 11.x rompe el build nativo de Android con el
  # scaffolding por defecto (registrant no encuentra FilePickerPlugin).
  file_picker: ^10.3.0

  # Reproducción de audio local (play/pausa/seek + posición en vivo).
  just_audio: ^0.10.4

  # --- Actualizador integrado (celular + PC) ---
  http: ^1.2.0                    # consultar la API de GitHub y descargar
  flutter_secure_storage: ^9.2.2  # guardar el token local de forma segura
  package_info_plus: ^8.0.0       # versión instalada (para comparar)
  path_provider: ^2.1.4           # carpeta donde guardar la descarga
  open_filex: ^4.5.0              # abrir el APK/instalador descargado

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
