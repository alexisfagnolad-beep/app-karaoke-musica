name: Build APK (Android)

# Compila un APK de debug instalable en Android y corre los tests.
# Como el repo todavía no tiene la carpeta nativa android/, el workflow la
# genera con `flutter create .` y le inyecta el permiso de micrófono.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

# Necesario para que el job pueda crear/actualizar la Release con el APK.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar carpetas nativas (android)
        run: flutter create . --platforms=android --project-name karaoke_musica

      - name: Inyectar permiso de micrófono
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <application|' "$MANIFEST"
          fi
          echo "----- AndroidManifest.xml -----"
          cat "$MANIFEST"

      - name: Instalar dependencias
        run: flutter pub get

      - name: Tests
        run: flutter test

      - name: Compilar APK de debug
        run: flutter build apk --debug

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: karaoke-musica-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Renombrar APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk karaoke-musica-debug.apk

      # Publica el APK en una Release con tag fijo: la URL queda estable y se
      # actualiza el mismo archivo en cada build de la rama por defecto.
      - name: Publicar APK en Release (link estable)
        if: github.ref == 'refs/heads/claude/charming-thompson-21cbj2'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: APK de Karaoke (Android, debug)
          body: |
            APK de debug del Modo Karaoke Rápido. Se actualiza automáticamente
            en cada build. Descargá `karaoke-musica-debug.apk` de abajo.
          files: karaoke-musica-debug.apk
